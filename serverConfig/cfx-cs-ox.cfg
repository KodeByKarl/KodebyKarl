# Toggle targeting when pressing the hotkey, instead of holding it down.
setr ox_target:toggleHotkey 0
 
# Change the key to enable targeting (https://docs.fivem.net/docs/game-references/input-mapper-parameter-ids/keyboard)
setr ox_target:defaultHotkey LMENU
 
# Draw a sprite (circle) at the centroid of a zone.
setr ox_target:drawSprite 1
 
# Enable built-in targeting options, e.g. toggling vehicle doors.
setr ox_target:defaults 1
 
# Enable debugging / testing options, entity outlines, and a raycast indicator.
setr ox_target:debug 0
 
# Enable / Disable leftclick to select options
setr ox_target:leftClick 1

# Disable entity outline (default: 1 = enabled)
setr ox_target:drawOutline 1

# Use target's interaction distance for outline (default: 1 = enabled)
# When enabled, outline only appears when close enough to interact
setr ox_target:outlineUseTargetDistance 1

# Distance at which entity outline appears (default: 5)
# Only used when outlineUseTargetDistance is disabled
setr ox_target:outlineDistance 5

# Outline color as R,G,B,A (default: 255,255,255,255 = white)
setr ox_target:outlineColor "106,106,255,255"

# Disable vignette/darkened corners effect (default: 1 = enabled)
setr ox_target:vignette 0

# Center cursor on screen when targeting starts (default: 1 = enabled)
setr ox_target:centerCursor 1

# Close target menu after selecting an option (default: 1 = enabled)
# Set to 0 to keep the menu open, allowing multiple option clicks
setr ox_target:closeOnSelect 0

